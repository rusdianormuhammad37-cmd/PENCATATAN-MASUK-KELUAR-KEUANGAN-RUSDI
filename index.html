<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: {
                        primary: '#3b82f6', success: '#10b981', danger: '#ef4444',
                        dark: '#1e293b', light: '#f8fafc',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-slate-700 font-sans antialiased bg-slate-50">

<!-- HALAMAN LOGIN -->
<div id="authContainer" class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-wallet text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Buku Kas Kita</h2>
            <p class="text-sm text-slate-500 mt-1">Silakan masuk untuk mencatat keuangan Anda</p>
        </div>
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-envelope"></i></div>
                    <input type="email" id="authEmail" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary transition-colors" placeholder="email@anda.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-lock"></i></div>
                    <input type="password" id="authPassword" required class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary transition-colors" placeholder="Minimal 6 karakter">
                </div>
            </div>
            <div class="pt-2 space-y-3">
                <button type="button" onclick="handleAuth('login')" class="w-full bg-primary hover:bg-blue-600 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition-colors">Masuk</button>
                <button type="button" onclick="handleAuth('register')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition-colors">Daftar Akun Baru</button>
            </div>
        </form>
    </div>
</div>

<!-- APLIKASI UTAMA -->
<div id="mainApp" class="hidden min-h-screen flex-col">
    <header class="bg-white shadow-sm sticky top-0 z-10 pt-4">
        <div class="max-w-4xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2 text-primary">
                <i class="fa-solid fa-wallet text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight">Buku Kas Kita</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="handleLogout()" class="text-sm font-medium text-danger hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </div>
        
        <!-- NAVIGASI TAB -->
        <div class="max-w-4xl mx-auto px-4 mt-6">
            <nav class="flex gap-6 border-b border-slate-200">
                <button onclick="switchPage('home')" id="nav-home" class="py-3 px-1 border-b-2 border-primary text-primary font-medium text-sm transition-colors">
                    <i class="fa-solid fa-house mr-1"></i> Beranda
                </button>
                <button onclick="switchPage('category')" id="nav-category" class="py-3 px-1 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-medium text-sm transition-colors">
                    <i class="fa-solid fa-chart-pie mr-1"></i> Kategori
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- KONTROL FILTER -->
        <section class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <div class="flex bg-slate-100 p-1 rounded-lg w-full sm:w-auto">
                <button onclick="setFilter('all')" id="btnFilter-all" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium rounded-md transition-colors bg-white shadow-sm text-primary">Semua Waktu</button>
                <button onclick="setFilter('month')" id="btnFilter-month" class="flex-1 sm:flex-none px-4 py-2 text-sm font-medium rounded-md transition-colors text-slate-500 hover:text-slate-700">Bulan Ini</button>
            </div>
            <button onclick="openModal()" class="w-full sm:w-auto bg-primary hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium transition-colors shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> <span>Catat Transaksi</span>
            </button>
        </section>

        <!-- HALAMAN 1: BERANDA -->
        <div id="page-home" class="flex flex-col gap-6">
            <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 relative overflow-hidden group">
                    <p class="text-sm font-medium text-slate-500 mb-1">Total Saldo</p>
                    <h2 class="text-3xl font-bold text-slate-800" id="totalBalance">Rp 0</h2>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 relative overflow-hidden group">
                    <p class="text-sm font-medium text-slate-500 mb-1">Pemasukan</p>
                    <h2 class="text-2xl font-bold text-success" id="totalIncome">Rp 0</h2>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-5 border border-slate-100 relative overflow-hidden group">
                    <p class="text-sm font-medium text-slate-500 mb-1">Pengeluaran</p>
                    <h2 class="text-2xl font-bold text-danger" id="totalExpense">Rp 0</h2>
                </div>
            </section>

            <section class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <h3 class="font-semibold text-slate-800">Riwayat Transaksi</h3>
                    <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full" id="transactionCount">0 item</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-white border-b border-slate-100 text-xs uppercase text-slate-400 font-semibold tracking-wider">
                                <th class="px-5 py-3">Tanggal</th>
                                <th class="px-5 py-3">Deskripsi</th>
                                <th class="px-5 py-3">Kategori</th>
                                <th class="px-5 py-3 text-right">Jumlah (Rp)</th>
                                <th class="px-5 py-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- HALAMAN 2: KATEGORI -->
        <div id="page-category" class="hidden flex-col gap-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100 bg-red-50 text-danger flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i>
                        <h3 class="font-semibold">Statistik Pengeluaran</h3>
                    </div>
                    <div class="p-5">
                        <div id="expenseCategoryList" class="space-y-4"></div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100 bg-emerald-50 text-success flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie"></i>
                        <h3 class="font-semibold">Statistik Pemasukan</h3>
                    </div>
                    <div class="p-5">
                        <div id="incomeCategoryList" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- MODAL TAMBAH / EDIT TRANSAKSI -->
<div id="transactionModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-4 transition-opacity opacity-0">
    <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-transform translate-y-full sm:translate-y-4" id="modalContent">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
            <h3 class="text-lg font-bold text-slate-800">Tambah Transaksi</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors rounded-full p-1 hover:bg-slate-100">
                <i class="fa-solid fa-xmark text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>
        </div>
        <form id="transactionForm" class="p-6">
            <div class="mb-4">
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="type" value="income" class="peer sr-only" checked onchange="updateCategoryOptions()">
                        <div class="text-center py-2 px-4 rounded-lg border-2 border-slate-200 peer-checked:border-success peer-checked:bg-emerald-50 peer-checked:text-success text-slate-500 font-medium transition-all">Pemasukan</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="type" value="expense" class="peer sr-only" onchange="updateCategoryOptions()">
                        <div class="text-center py-2 px-4 rounded-lg border-2 border-slate-200 peer-checked:border-danger peer-checked:bg-red-50 peer-checked:text-danger text-slate-500 font-medium transition-all">Pengeluaran</div>
                    </label>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
                <select id="category" required class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary bg-white"></select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">Jumlah (Rp)</label>
                <input type="text" id="amount" required class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary" placeholder="0" oninput="formatRupiahInput(this)">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan</label>
                <input type="text" id="description" required class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary" placeholder="Misal: Beli makan, Gaji...">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal</label>
                <input type="date" id="date" required class="block w-full px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-primary focus:border-primary text-slate-700">
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-medium py-3 px-4 rounded-lg transition-colors">Simpan Transaksi</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
